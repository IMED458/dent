name: Build app for GitHub Pages

# GitHub Pages ემსახურება main ბრენჩს (root). ბრაუზერს TSX წყაროს გაშვება არ შეუძლია,
# ამიტომ აწყობილი პროგრამა ინახება app/ საქაღალდეში და index.html github.io-ზე იქ გადამისამართებს.
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir app --emptyOutDir
      - name: Commit app/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build app/ for GitHub Pages [skip ci]"
          git push
      - name: Request Pages rebuild
        run: curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
